 {q:'課長は仕事≪　≫ヨーロッパ旅行を楽しんできたらしい。',c:['にかこつけて','にそくして','をふまえて','にひきかえ'],a:0,m:{ja:'本当の目的とは別のものを、表向きの理由にする',en:'use something as a pretext for a different real purpose',zh:'拿某件事作借口，去做真正想做的事',tw:'拿某件事當藉口，去做真正想做的事',my:'အခြားရည်ရွယ်ချက်အတွက် တစ်ခုခုကို အကြောင်းပြချက်အဖြစ် အသုံးချခြင်း'},e:{ja:'課長は「仕事」を表向きの理由にして、実際には旅行も楽しみました。「にかこつけて」は、少し批判する気持ちを含むことがあります。',en:'The section chief used work as the stated reason but also enjoyed a trip. にかこつけて can carry a mildly critical tone.',zh:'课长以“工作”为表面理由，实际上也享受了欧洲旅行。「にかこつけて」有时含有一点批评的语气。',tw:'課長以「工作」為表面理由，實際上也享受了歐洲旅行。「にかこつけて」有時帶有一點批評的語氣。',my:'ဌာနမှူးက 「အလုပ်」ကို အကြောင်းပြပြီး တကယ်တမ်း ဥရောပခရီးကိုလည်း ပျော်ရွှင်ခဲ့သည်။ 「にかこつけて」တွင် အနည်းငယ် ဝေဖန်သည့်သဘော ပါနိုင်သည်။'},o:{ja:'「にそくして」はルールなどに従うこと、「をふまえて」は考える材料にすること、「にひきかえ」は二つを比べる表現です。',en:'にそくして means following a rule, をふまえて means taking something into account, and にひきかえ contrasts two things.',zh:'「にそくして」表示遵循规则；「をふまえて」表示把某事作为考虑依据；「にひきかえ」用于对比两件事。',tw:'「にそくして」表示遵循規則；「をふまえて」表示把某事作為考量依據；「にひきかえ」用來對比兩件事。',my:'「にそくして」က စည်းမျဉ်းကို လိုက်နာခြင်း၊ 「をふまえて」က စဉ်းစားရာတွင် အခြေခံခြင်း၊ 「にひきかえ」က အရာနှစ်ခု နှိုင်းယှဉ်ခြင်း ဖြစ်သည်။'}},
 {q:'死者が出る≪　≫、政府はやっと新型インフルエンザワクチンの開発を命じた。',c:['によって','にいたって','にかまけて','をへて'],a:1,m:{ja:'ある深刻な段階になって、やっと',en:'only after a serious stage has been reached',zh:'直到事情发展到某个严重阶段才……',tw:'直到事情發展到某個嚴重階段才……',my:'အခြေအနေ ဆိုးရွားသည့်အဆင့်သို့ ရောက်မှသာ'},e:{ja:'死者が出るほど深刻な段階になってから、政府が「やっと」動きました。「にいたって」と「やっと」の組み合わせが合います。',en:'The government acted only after the situation became serious enough for deaths to occur. にいたって works naturally with やっと here.',zh:'直到出现死者、事态变得如此严重以后，政府“才”采取行动。「にいたって」和「やっと」在这里自然搭配。',tw:'直到出現死者、事態變得如此嚴重之後，政府「才」採取行動。「にいたって」和「やっと」在這裡自然搭配。',my:'လူသေဆုံးသည်အထိ အခြေအနေဆိုးလာပြီးမှ အစိုးရက 「နောက်ဆုံးတော့」 စတင်လုပ်ဆောင်ခဲ့သည်။ ထို့ကြောင့် 「にいたって」 နှင့် 「やっと」 ကိုက်ညီသည်။'},o:{ja:'「によって」は原因・手段、「にかまけて」は一つのことに夢中で他をしないこと、「をへて」は時間や過程を通ることです。',en:'によって marks a cause or means; にかまけて means neglecting other things while absorbed in one; をへて means going through a period or process.',zh:'「によって」表示原因或手段；「にかまけて」表示只顾一件事而忽略其他事；「をへて」表示经过一段时间或过程。',tw:'「によって」表示原因或手段；「にかまけて」表示只顧一件事而忽略其他事；「をへて」表示經過一段時間或過程。',my:'「によって」က အကြောင်းရင်း/နည်းလမ်း၊ 「にかまけて」က တစ်ခုကိုသာ လုပ်ပြီး အခြားအရာကို ပစ်ထားခြင်း၊ 「をへて」က အချိန် သို့မဟုတ် လုပ်ငန်းစဉ်ကို ဖြတ်သန်းခြင်း ဖြစ်သည်။'}},
 {q:'その新人選手は必ず1位になってみせると断言して≪　≫。',c:['やまない','はばからない','はかなわない','おかない'],a:1,m:{ja:'普通なら遠慮することを、気にせず堂々とする',en:'do or say something boldly, without hesitation',zh:'毫不顾忌、毫不犹豫地说或做',tw:'毫不顧忌、毫不猶豫地說或做',my:'အားမနာဘဲ ရဲရဲဝံ့ဝံ့ ပြောခြင်း သို့မဟုတ် လုပ်ခြင်း'},e:{ja:'「断言してはばからない」は、周りを気にせず堂々と言い切る、という決まった使い方です。新人なのに強く言う様子も表せます。',en:'断言してはばからない is a set expression meaning to declare something boldly without worrying about others. It also highlights how strongly a newcomer speaks.',zh:'「断言してはばからない」是固定用法，表示不顾周围人的看法，毫不犹豫地断言。这里也表现出新人选手说得非常有自信。',tw:'「断言してはばからない」是固定用法，表示不顧周圍人的看法，毫不猶豫地斷言。這裡也表現出新人選手說得非常有自信。',my:'「断言してはばからない」သည် ပတ်ဝန်းကျင်ကို ဂရုမစိုက်ဘဲ ရဲရဲဝံ့ဝံ့ အခိုင်အမာပြောသည်ဟု အဓိပ္ပာယ်ရသော ပုံသေသုံးပုံဖြစ်သည်။'},o:{ja:'「やまない」は願う・尊敬するなどの気持ちが続く時、「ておかない」は「必ず〜する」の形で使います。「てはかなわない」はつらくて耐えられない意味です。',en:'やまない follows lasting feelings such as hope or respect. ておかない is used in the pattern “will certainly do.” てはかなわない means something is unbearable.',zh:'「やまない」用于愿望、尊敬等感情持续不止；「ておかない」用于“必定要做……”；「てはかなわない」表示难以忍受。',tw:'「やまない」用於願望、尊敬等感情持續不止；「ておかない」用於「必定要做……」；「てはかなわない」表示難以忍受。',my:'「やまない」ကို မျှော်လင့်ခြင်း/လေးစားခြင်း ဆက်လက်ရှိသည့်အခါ သုံးသည်။ 「ておかない」က မဖြစ်မနေ လုပ်မည်၊ 「てはかなわない」က သည်းမခံနိုင်ဟု ဆိုလိုသည်။'}},
 {q:'地震の被害者のニュースが流れるにつけ、涙を禁じ≪　≫。',c:['まい','えない','ざるをえない','かねない'],a:1,m:{ja:'気持ちや涙を、自分の意志で抑えられない',en:'be unable to suppress a feeling or tears',zh:'无法抑制感情或眼泪',tw:'無法抑制感情或眼淚',my:'ခံစားချက် သို့မဟုတ် မျက်ရည်ကို မထိန်းနိုင်ခြင်း'},e:{ja:'「涙を禁じ得ない」で、涙を抑えることができない、という一つの表現になります。「得ない」はここでは「できない」です。',en:'涙を禁じ得ない is one expression meaning “cannot hold back one’s tears.” Here, 得ない means “cannot.”',zh:'「涙を禁じ得ない」整体表示“无法忍住眼泪”。这里的「得ない」就是“不能”的意思。',tw:'「涙を禁じ得ない」整體表示「無法忍住眼淚」。這裡的「得ない」就是「不能」的意思。',my:'「涙を禁じ得ない」တစ်စုလုံးက “မျက်ရည်ကို မထိန်းနိုင်” ဟု အဓိပ္ပာယ်ရသည်။ ဤနေရာတွင် 「得ない」သည် “မလုပ်နိုင်” ဟုဆိုလိုသည်။'},o:{ja:'「ざるを得ない」は、したくなくてもする必要がある時に使います。「かねない」は悪いことが起こる可能性です。「禁じまい」は「抑えないつもりだ」となり、文意に合いません。',en:'ざるを得ない means being forced to do something; かねない marks the possibility of a bad result; 禁じまい would mean “intend not to suppress,” which does not fit.',zh:'「ざるを得ない」表示虽然不想做但不得不做；「かねない」表示可能发生不好的事；「禁じまい」会变成“不打算抑制”，不符合句意。',tw:'「ざるを得ない」表示雖然不想做但不得不做；「かねない」表示可能發生不好的事；「禁じまい」會變成「不打算抑制」，不符合句意。',my:'「ざるを得ない」က မလုပ်ချင်သော်လည်း လုပ်ရမည်၊ 「かねない」က မကောင်းသောအရာ ဖြစ်နိုင်သည်ဟု ဆိုလိုသည်။ 「禁じまい」မှာ “မထိန်းရန် ရည်ရွယ်သည်” ဖြစ်၍ မကိုက်ညီပါ။'}},
 {q:'そのウイルスによる感染は国内≪　≫世界中に広がった。',c:['にいたって','をよそに','にとどまらず','をものともせず'],a:2,m:{ja:'その範囲だけで終わらず、さらに広がる',en:'not be limited to one area but spread further',zh:'不止于这个范围，还进一步扩大',tw:'不只限於這個範圍，還進一步擴大',my:'အတိုင်းအတာတစ်ခုတွင် မရပ်ဘဲ ဆက်လက်ကျယ်ပြန့်ခြင်း'},e:{ja:'感染は「国内」だけで終わらず、「世界中」へ範囲が広がりました。範囲の広がりを表す「にとどまらず」が合います。',en:'The infection did not stop within the country; it spread worldwide. にとどまらず expresses this expansion in range.',zh:'感染没有只停留在“国内”，而是扩大到了“全世界”。表示范围扩大的「にとどまらず」最合适。',tw:'感染沒有只停留在「國內」，而是擴大到「全世界」。表示範圍擴大的「にとどまらず」最適合。',my:'ကူးစက်မှုသည် 「နိုင်ငံအတွင်း」၌သာ မရပ်ဘဲ 「ကမ္ဘာတစ်ဝန်း」သို့ ပြန့်သွားသည်။ အတိုင်းအတာကျယ်လာခြင်းကို ပြသော 「にとどまらず」 ကို သုံးရသည်။'},o:{ja:'「をよそに」は周りを気にしないこと、「をものともせず」は困難に負けないことです。「にいたって」は、ある段階に到達する意味です。',en:'をよそに means ignoring what is happening around one, をものともせず means not being defeated by difficulty, and にいたって means reaching a stage.',zh:'「をよそに」表示不顾周围情况；「をものともせず」表示不向困难低头；「にいたって」表示到达某个阶段。',tw:'「をよそに」表示不顧周圍情況；「をものともせず」表示不向困難低頭；「にいたって」表示到達某個階段。',my:'「をよそに」က ပတ်ဝန်းကျင်ကို ဂရုမစိုက်ခြင်း၊ 「をものともせず」က အခက်အခဲကို မရှုံးခြင်း၊ 「にいたって」က အဆင့်တစ်ခုသို့ ရောက်ခြင်း ဖြစ်သည်။'}},
 {q:'この手紙に「田中一郎≪　≫」と書いてあるけど、知らないなあ。誰だろう。',c:['にて','こそ','とは','より'],a:3,m:{ja:'手紙などで「〜から」を表す、少しかたい言い方',en:'a somewhat formal way to write “from” in a letter',zh:'在信件等场合表示“来自……”的较正式说法',tw:'在信件等場合表示「來自……」的較正式說法',my:'စာတွင် “〜ထံမှ” ဟု ရေးသည့် အနည်းငယ်စာပေဆန်သောပုံစံ'},e:{ja:'手紙の最後などにある「田中一郎より」は、「田中一郎から」という意味です。書いた人・送った人を示します。',en:'田中一郎より at the end of a letter means “from Tanaka Ichiro.” It identifies the writer or sender.',zh:'信末的「田中一郎より」就是“来自田中一郎”的意思，用来表示写信人或寄信人。',tw:'信末的「田中一郎より」就是「來自田中一郎」的意思，用來表示寫信人或寄信人。',my:'စာအဆုံးရှိ 「田中一郎より」သည် “တနာကာ အိချိရိုထံမှ” ဟုဆိုလိုပြီး စာရေးသူ/ပို့သူကို ဖော်ပြသည်။'},o:{ja:'「にて」は場所・手段、「こそ」は強調です。「とは」は驚きや定義などに使いますが、差出人を表しません。',en:'にて marks a place or means; こそ adds emphasis; とは can show surprise or a definition, but it does not identify a sender.',zh:'「にて」表示地点或手段；「こそ」表示强调；「とは」可表示惊讶或定义，但不能表示寄信人。',tw:'「にて」表示地點或手段；「こそ」表示強調；「とは」可表示驚訝或定義，但不能表示寄信人。',my:'「にて」က နေရာ/နည်းလမ်း၊ 「こそ」က အလေးပေးခြင်း ဖြစ်သည်။ 「とは」ကို အံ့ဩခြင်း/အဓိပ္ပာယ်သတ်မှတ်ခြင်းအတွက် သုံးသော်လည်း ပို့သူကို မဖော်ပြပါ။'}},
 {q:'うちの夫は最近深夜まで帰ってこない。どこで何をしているの≪　≫。',c:['やら','なんか','とか','とて'],a:0,m:{ja:'はっきり分からず、疑問や困った気持ちがある',en:'show uncertainty, wondering, or concern',zh:'表示不清楚，并带有疑问或困扰的心情',tw:'表示不清楚，並帶有疑問或困擾的心情',my:'သေချာမသိ၍ စိုးရိမ်/သိချင်သည့် ခံစားချက်ကို ဖော်ပြခြင်း'},e:{ja:'夫が何をしているか分からず、疑問や困った気持ちがあります。文末の「のやら」が、その気持ちを表します。',en:'The speaker does not know what her husband is doing and feels puzzled or worried. Sentence-final のやら expresses this feeling.',zh:'说话人不知道丈夫在做什么，感到疑惑或担心。句末的「のやら」能表达这种心情。',tw:'說話人不知道丈夫在做什麼，感到疑惑或擔心。句末的「のやら」能表達這種心情。',my:'ခင်ပွန်း ဘာလုပ်နေသည်ကို မသိ၍ စိတ်ရှုပ်/စိုးရိမ်နေသည်။ စာကြောင်းအဆုံးက 「のやら」က ထိုခံစားချက်ကို ဖော်ပြသည်။'},o:{ja:'「なんか」は例を軽く示したり見下したりする時、「とか」は例や伝聞に使います。「とて」は「〜でも」という、かたい表現です。',en:'なんか gives a casual example or dismissive tone; とか lists examples or reports hearsay; とて is a formal expression meaning “even.”',zh:'「なんか」用于随意举例或表示轻视；「とか」用于举例或转述；「とて」是表示“即使……”的正式说法。',tw:'「なんか」用於隨意舉例或表示輕視；「とか」用於舉例或轉述；「とて」是表示「即使……」的正式說法。',my:'「なんか」ကို ပေါ့ပေါ့ပါးပါး ဥပမာပေးခြင်း/အထင်သေးခြင်း၊ 「とか」ကို ဥပမာ/တစ်ဆင့်ကြားသတင်း၊ 「とて」ကို “〜ပင်လျှင်” ဟူသော စာပေပုံစံအဖြစ် သုံးသည်။'}},
 {q:'今からうちを出た≪　≫コンサートにはもう間に合わないよ。あきらめよう。',c:['ところ','ところが','ところを','ところで'],a:3,m:{ja:'たとえ〜しても、期待する結果にはならない',en:'even if something is done, the expected result will not follow',zh:'即使做了……，也不会得到期待的结果',tw:'即使做了……，也不會得到期待的結果',my:'တစ်ခုခုလုပ်လျှင်ပင် မျှော်လင့်သည့်ရလဒ် မရခြင်း'},e:{ja:'今から出ても、間に合わないという否定的な結果です。「動詞た形＋ところで」は「たとえ〜ても」の意味になります。',en:'Even if they leave now, the negative result—not arriving in time—will not change. Verb-ta form + ところで means “even if.”',zh:'即使现在出门，也赶不上。结果不会改变。「动词た形＋ところで」表示“即使……也……”。',tw:'即使現在出門，也趕不上。結果不會改變。「動詞た形＋ところで」表示「即使……也……」。',my:'ယခုထွက်လျှင်ပင် အချိန်မမီပါ။ ရလဒ် မပြောင်းပါ။ 「ကြိယာた形＋ところで」သည် “လုပ်လျှင်ပင်” ဟု ဆိုလိုသည်။'},o:{ja:'「たところ」は、した直後や、して分かった結果を表します。「ところが」は予想外の展開、「ところを」は場面や状況を示します。',en:'たところ marks a point just after doing something or a discovered result; ところが introduces an unexpected turn; ところを marks a scene or situation.',zh:'「たところ」表示刚做完，或做后发现的结果；「ところが」表示出乎意料的转折；「ところを」表示某个场面或状况。',tw:'「たところ」表示剛做完，或做後發現的結果；「ところが」表示出乎意料的轉折；「ところを」表示某個場面或狀況。',my:'「たところ」က လုပ်ပြီးချက်ချင်း/လုပ်ပြီးသိလာသည့်ရလဒ်၊ 「ところが」က မမျှော်လင့်သော အလှည့်အပြောင်း၊ 「ところを」က အခြေအနေတစ်ခုကို ပြသည်။'}},
 {q:'言わなければ≪　≫、父はすぐ変なことを言って、母をイライラさせる。',c:['いいことを','いいものを','いいことで','いいもので'],a:1,m:{ja:'〜すればいいのに、実際はそうしない、と責める',en:'criticize someone for not doing what would have been better',zh:'表示责备：明明那样做就好了，实际却没有那样做',tw:'表示責備：明明那樣做就好了，實際卻沒有那樣做',my:'ထိုသို့လုပ်လျှင်ကောင်းမည်ဖြစ်သော်လည်း မလုပ်သည့်အတွက် အပြစ်တင်ခြင်း'},e:{ja:'「〜ばいいものを」は、「そうすればいいのに、実際はしない」という不満や非難を表します。ここでは「変なことを言わなければいいのに」という意味です。',en:'〜ばいいものを expresses dissatisfaction or criticism: “It would be better if he did that, but he does not.” Here it means, “He should simply not say strange things.”',zh:'「〜ばいいものを」表示不满或责备，意思是“那样做就好了，可实际上却不那样做”。这里就是“明明不说奇怪的话就好了”。',tw:'「〜ばいいものを」表示不滿或責備，意思是「那樣做就好了，可是實際上卻不那樣做」。這裡就是「明明不說奇怪的話就好了」。',my:'「〜ばいいものを」သည် “ထိုသို့လုပ်လျှင်ကောင်းမည်၊ သို့သော် တကယ်မလုပ်” ဟူသော မကျေနပ်မှု/အပြစ်တင်မှုကို ပြသည်။ ဤနေရာတွင် “ထူးဆန်းတာတွေ မပြောရင်ကောင်းမယ်” ဟုဆိုလိုသည်။'},o:{ja:'この文型は「ものを」という形が決まっています。「ことを」「ことで」「もので」に替えることはできません。',en:'This grammar pattern specifically requires ものを. It cannot be replaced with ことを, ことで, or もので.',zh:'这个语法的形式固定为「ものを」，不能换成「ことを」「ことで」或「もので」。',tw:'這個文法的形式固定為「ものを」，不能換成「ことを」「ことで」或「もので」。',my:'ဤသဒ္ဒါပုံစံကို 「ものを」 ဟုသာ သုံးရပြီး 「ことを」「ことで」「もので」နှင့် အစားထိုးမရပါ။'}},
 {q:'このグループは自然環境を守る≪　≫、10年以上も植林活動をしている。',c:['べき','べく','べからざる','べし'],a:1,m:{ja:'〜するために、という目的を表す、かたい言い方',en:'a formal expression meaning “in order to”',zh:'表示“为了……”这一目的的正式说法',tw:'表示「為了……」這一目的的正式說法',my:'“〜ရန်အတွက်” ဟူသော ရည်ရွယ်ချက်ကို ပြသည့် စာပေပုံစံ'},e:{ja:'植林活動の目的は、自然環境を守ることです。「動詞の辞書形＋べく」で「〜するために」という目的を表します。',en:'The purpose of the tree-planting activity is to protect the natural environment. Dictionary-form verb + べく formally expresses purpose: “in order to.”',zh:'植树活动的目的是保护自然环境。「动词辞书形＋べく」以正式的方式表示“为了……”。',tw:'植樹活動的目的是保護自然環境。「動詞辭書形＋べく」以正式的方式表示「為了……」。',my:'သစ်ပင်စိုက်လှုပ်ရှားမှု၏ ရည်ရွယ်ချက်မှာ သဘာဝပတ်ဝန်းကျင်ကို ကာကွယ်ရန် ဖြစ်သည်။ 「ကြိယာအဘိဓာန်ပုံစံ＋べく」က “〜ရန်အတွက်” ဟု ဖော်ပြသည်။'},o:{ja:'「べき」は義務・当然、「べからざる」は「してはいけない／できない」、「べし」は古い文体で命令・当然などを表します。目的を表す形は「べく」です。',en:'べき expresses duty or what is proper; べからざる means prohibited or impossible; べし is an old written form for commands or obligation. べく is the purpose form.',zh:'「べき」表示义务或理所当然；「べからざる」表示禁止或不可能；「べし」是表示命令、应当等的古老书面形式。表示目的要用「べく」。',tw:'「べき」表示義務或理所當然；「べからざる」表示禁止或不可能；「べし」是表示命令、應當等的古老書面形式。表示目的要用「べく」。',my:'「べき」က တာဝန်/သင့်တော်မှု၊ 「べからざる」က တားမြစ်မှု/မဖြစ်နိုင်မှု၊ 「べし」က အမိန့်/သင့်သည်ဟူသော ရှေးစာပေပုံစံ ဖြစ်သည်။ ရည်ရွယ်ချက်အတွက် 「べく」ကို သုံးသည်။'}},
 {q:'彼のメールアドレスを知らないので、連絡を≪　≫んです。',c:['とろうともとれない','とろうがとれない','とろうにとれない','とろうにもとれない'],a:3,m:{ja:'したいと思っても、事情があってできない',en:'be unable to do something even though one wants or tries to',zh:'即使想做，也因为某种原因做不到',tw:'即使想做，也因為某種原因做不到',my:'လုပ်ချင်/ကြိုးစားသော်လည်း အခြေအနေကြောင့် မလုပ်နိုင်ခြင်း'},e:{ja:'メールアドレスを知らないため、連絡したくてもできません。「意向形＋にも＋可能形の否定」で「しようとしてもできない」を表します。',en:'Because the speaker does not know the email address, contacting him is impossible despite wanting to. Volitional form + にも + negative potential form means “cannot do even if one tries.”',zh:'因为不知道对方的邮箱地址，所以即使想联系也联系不上。「意志形＋にも＋可能形的否定」表示“即使想做也做不到”。',tw:'因為不知道對方的電子郵件地址，所以即使想聯絡也聯絡不上。「意向形＋にも＋可能形的否定」表示「即使想做也做不到」。',my:'အီးမေးလ်လိပ်စာ မသိသောကြောင့် ဆက်သွယ်ချင်သော်လည်း မဆက်သွယ်နိုင်ပါ။ 「意向形＋にも＋ဖြစ်နိုင်ပုံ အငြင်း」က “ကြိုးစားလျှင်ပင် မလုပ်နိုင်” ဟုဆိုလိုသည်။'},o:{ja:'この文型では、意向形の後に「にも」が必要です。「とも」「が」「に」だけでは、決まった形になりません。',en:'This pattern requires にも after the volitional form. とも, が, or に alone does not make the required construction.',zh:'这个句型中，意志形后必须接「にも」。只用「とも」「が」或「に」不能构成正确形式。',tw:'這個句型中，意向形後必須接「にも」。只用「とも」「が」或「に」不能構成正確形式。',my:'ဤပုံစံတွင် 意向形 နောက်၌ 「にも」 မဖြစ်မနေ လိုသည်။ 「とも」「が」「に」 တစ်ခုတည်းဖြင့် ပုံစံမပြည့်ပါ။'}},
 {q:'彼女は僕のことを許してくれた≪　≫と思っていたが、まだ怒っている。',c:['もの','こと','ところ','ばかり'],a:0,m:{ja:'当然そうだ、確かにそうだと判断する',en:'assume or believe that something is certainly the case',zh:'认为某事当然如此或确实如此',tw:'認為某事當然如此或確實如此',my:'တစ်ခုခု အမှန်ဖြစ်သည်ဟု ယူဆ/ယုံကြည်ခြင်း'},e:{ja:'「〜たものと思っていた」は、「当然もう〜たと判断していた」という意味です。許してくれたと思ったのに、実際は違った、という流れです。',en:'〜たものと思っていた means “I had assumed that it had already happened.” He thought she had forgiven him, but reality was different.',zh:'「〜たものと思っていた」表示“我一直认为当然已经……了”。他以为她已经原谅自己，但事实并非如此。',tw:'「〜たものと思っていた」表示「我一直認為當然已經……了」。他以為她已經原諒自己，但事實並非如此。',my:'「〜たものと思っていた」သည် “ဖြစ်ပြီးသားဟု ယူဆထားခဲ့သည်” ဟုဆိုလိုသည်။ သူမက ခွင့်လွှတ်ပြီးပြီဟု ထင်သော်လည်း အမှန်မှာ မဟုတ်ပါ။'},o:{ja:'「ことと思う」は相手の状況を想像する時などに使います。「たところ」は直後・結果、「たばかり」は、した後あまり時間がたっていない意味です。',en:'ことと思う is often used when imagining another person’s situation; たところ marks the point just after an action or its result; たばかり means only a short time has passed since the action.',zh:'「ことと思う」常用于推测对方的状况；「たところ」表示刚做完或做后的结果；「たばかり」表示做完后还没过多久。',tw:'「ことと思う」常用於推測對方的狀況；「たところ」表示剛做完或做後的結果；「たばかり」表示做完後還沒過多久。',my:'「ことと思う」ကို အခြားသူအခြေအနေ ခန့်မှန်းရာတွင် သုံးလေ့ရှိသည်။ 「たところ」က လုပ်ပြီးချိန်/ရလဒ်၊ 「たばかり」က လုပ်ပြီး မကြာသေးဟု ဆိုလိုသည်။'}},
 {q:'毎日こう暑くては≪　≫。はやく秋になればいいのに。',c:['かまわない','かなわない','かねない','かいがない'],a:1,m:{ja:'つらくて、我慢できない',en:'be unbearable or too difficult to put up with',zh:'难以忍受、受不了',tw:'難以忍受、受不了',my:'ခက်ခဲလွန်း၍ သည်းမခံနိုင်ခြင်း'},e:{ja:'毎日とても暑くて我慢できない、という不満です。「〜てはかなわない」は、ある状態がつらくて耐えられない時に使います。',en:'The speaker complains that the daily heat is unbearable. 〜てはかなわない is used when a condition is too unpleasant to endure.',zh:'说话人在抱怨每天都这么热，实在受不了。「〜てはかなわない」用于表示某种状态太难受，无法忍耐。',tw:'說話人在抱怨每天都這麼熱，實在受不了。「〜てはかなわない」用於表示某種狀態太難受，無法忍耐。',my:'နေ့တိုင်း အလွန်ပူ၍ သည်းမခံနိုင်ကြောင်း မကျေနပ်မှုဖြစ်သည်။ 「〜てはかなわない」ကို အခြေအနေတစ်ခု ဆိုးလွန်း၍ မခံနိုင်သောအခါ သုံးသည်။'},o:{ja:'「かまわない」は問題ない、「かねない」は悪い結果の可能性がある、「かいがない」は努力などの効果がない、という意味です。',en:'かまわない means “no problem”; かねない means a bad result may occur; かいがない means an effort has not been worthwhile.',zh:'「かまわない」表示没关系；「かねない」表示可能发生不好的结果；「かいがない」表示努力等没有效果、不值得。',tw:'「かまわない」表示沒關係；「かねない」表示可能發生不好的結果；「かいがない」表示努力等沒有效果、不值得。',my:'「かまわない」က ပြဿနာမရှိ၊ 「かねない」က မကောင်းသောရလဒ် ဖြစ်နိုင်၊ 「かいがない」က ကြိုးစားမှု စသည် အကျိုးမရှိဟု ဆိုလိုသည်။'}},
 {q:'会場の入り口はひどい混雑だったが、≪　≫、何とか奥まで行くことができた。',c:['押そうと押されようと','押しては押されては','押しつ押されつ','押したら押したで'],a:2,m:{ja:'二つの動作を、互いにしたりされたりする',en:'two actions happen mutually or back and forth',zh:'两个动作相互、反复地进行',tw:'兩個動作互相、反覆地進行',my:'လုပ်ဆောင်ချက်နှစ်ခု အပြန်အလှန် ဖြစ်ခြင်း'},e:{ja:'混雑の中で、自分が人を押したり、人に押されたりしながら進みました。「〜つ〜つ」は、二つの動作が交互に行われる様子を表します。',en:'In the crowd, the person moved forward while pushing others and being pushed. 〜つ〜つ describes two actions occurring alternately or mutually.',zh:'在人群中，一边推别人，一边也被别人推着往前走。「〜つ〜つ」表示两个动作交替或相互发生。',tw:'在人群中，一邊推別人，一邊也被別人推著往前走。「〜つ〜つ」表示兩個動作交替或互相發生。',my:'လူကြပ်ထဲတွင် သူများကို တွန်းရင်း သူများကလည်း တွန်းရင်း ရှေ့ဆက်ခဲ့သည်။ 「〜つ〜つ」က လုပ်ဆောင်ချက်နှစ်ခု အလှည့်ကျ/အပြန်အလှန် ဖြစ်ပုံကို ပြသည်။'},o:{ja:'「〜ようと〜ようと」は、どちらの場合でも結果が同じという意味です。「ては」を二度使う形はここでは不自然です。「たら〜たで」は、その場合には別の問題がある、という意味です。',en:'〜ようと〜ようと means the result is the same in either case. Repeating ては is unnatural here. たら〜たで means that a different problem arises in that case.',zh:'「〜ようと〜ようと」表示无论哪种情况结果都一样；这里重复使用「ては」不自然；「たら〜たで」表示如果那样做，又会出现另一种问题。',tw:'「〜ようと〜ようと」表示無論哪種情況結果都一樣；這裡重複使用「ては」不自然；「たら〜たで」表示如果那樣做，又會出現另一種問題。',my:'「〜ようと〜ようと」က ဘယ်အခြေအနေဖြစ်ဖြစ် ရလဒ်တူသည်။ 「ては」ကို နှစ်ကြိမ်သုံးခြင်းက ဤနေရာတွင် မသဘာဝကျပါ။ 「たら〜たで」က ထိုအခြေအနေတွင် အခြားပြဿနာရှိမည်ဟု ဆိုလိုသည်။'}}
];
const cards=document.querySelector('#cards'),nav=document.querySelector('.qnav'),btn=document.querySelector('#langBtn'),menu=document.querySelector('#langMenu');let current=localStorage.getItem('n1lang')||'ja';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.documentElement.lang=current==='tw'?'zh-Hant-TW':current==='zh'?'zh-Hans':current==='my'?'my':current;btn.textContent='🌐 '+langs[current]+' ▾';document.querySelectorAll('[data-ui]').forEach(el=>el.innerHTML=ui[current][el.dataset.ui]);nav.setAttribute('aria-label',ui[current].q);nav.innerHTML=data.map((_,i)=>`<a href="#q${i+1}" aria-label="${esc(ui[current].q)} ${i+1}">${i+1}</a>`).join('');cards.innerHTML=data.map((x,i)=>`<article class="card" id="q${i+1}"><div class="qhead"><span class="num">${i+1}</span><span class="tag">${esc(ui[current].q)} ${i+1}</span></div><p class="question">${esc(x.q).replace('≪　≫','<span class="blank">&nbsp;</span>')}</p><div class="choices">${x.c.map((v,j)=>`<div class="choice ${j===x.a?'correct':''}">${String.fromCharCode(97+j)}．${esc(v)}</div>`).join('')}</div><div class="answer"><div class="answer-label">${esc(ui[current].ans)}</div><div class="answer-main">${String.fromCharCode(97+x.a)}．${esc(x.c[x.a])}</div><div class="meaning"><strong>${esc(ui[current].meaning)}：</strong>${esc(x.m[current])}</div></div><p class="explain">${esc(x.e[current])}</p><div class="others"><strong>${esc(ui[current].other)}：</strong> ${esc(x.o[current])}</div></article>`).join('');menu.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.lang===current));}
Object.entries(langs).forEach(([code,name])=>{const b=document.createElement('button');b.type='button';b.dataset.lang=code;b.textContent=name;b.onclick=()=>{current=code;localStorage.setItem('n1lang',code);menu.hidden=true;btn.setAttribute('aria-expanded','false');render()};menu.appendChild(b)});btn.onclick=()=>{menu.hidden=!menu.hidden;btn.setAttribute('aria-expanded',String(!menu.hidden))};document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap')){menu.hidden=true;btn.setAttribute('aria-expanded','false')}});render();
</script>
</body>
</html>
